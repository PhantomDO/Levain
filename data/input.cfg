# Liaisons d'entrée du sandbox (ADR-0017). Une liaison par ligne, « # » commence un commentaire.
# Les noms des touches, boutons et axes sont ceux de SDL : « Space », « Left Shift », « a »,
# « leftx ». Modifier ce fichier ne demande **aucune recompilation**.

# Déplacement de la caméra libre. Une touche vaut ±1 ; l'échelle d'un axe de manette l'oriente.
axis move_right   = key:D, key:A:-1, pad:leftx
axis move_forward = key:W, key:S:-1, pad:lefty:-1
axis move_up      = key:E, key:Q:-1, pad:righttrigger, pad:lefttrigger:-1

# Regard. La souris donne un déplacement, la manette une vitesse : le moteur ramène les deux à une
# vitesse, et l'échelle règle la sensibilité (ADR-0017).
axis look_right = mouse:x:0.15, pad:rightx:90
axis look_up    = mouse:y:-0.15, pad:righty:-90

# Actions. « look_enable » tient le regard à la souris tant que le bouton droit est enfoncé ;
# à la manette, le stick droit suffit.
action look_enable = mouse:right
action sprint      = key:Left Shift, pad:leftstick

# Sélection (M6.2) : un clic gauche désigne le corps visé, dont le contour s'affiche en jaune.
action select      = mouse:left

# Saut du personnage (M6.3, --view character).
action jump        = key:Space, pad:a
