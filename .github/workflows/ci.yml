name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une PR poussée trois fois de suite n'occupe pas trois fois les runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Linux seul (ADR-0011). Les jobs Windows de la v0.3 sont retirés : Donnovan n'a pas de
    # machine Windows et le projet ne le cible pas pour l'instant. Les deux bugs de M0.2 —
    # /Zc:__cplusplus et la divergence <ostream> — étaient tous deux propres à MSVC.
    #
    # Les noms `linux-debug`, `linux-release` et `linux-asan` sont les checks requis par la
    # protection de `main` : ne pas les renommer sans mettre la protection à jour d'abord.
    #
    # `linux-asan` compile en Debug avec AddressSanitizer (dont LeakSanitizer) et
    # UndefinedBehaviorSanitizer, puis lance tests et sandbox : une fuite ou un comportement
    # indéfini fait échouer le job.
    name: ${{ matrix.preset }}
    # L'image de la machine de référence (SPECS §10), en toutes lettres : `ubuntu-latest` change
    # de version quand GitHub le décide, et la CI s'écarterait de la boîte de dev sans un mot.
    # Elle est aussi dans les clés du cache vcpkg : changer les deux ensemble.
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release, linux-asan]

    env:
      # Doit rester égal au "builtin-baseline" de vcpkg.json : vcpkg résout les versions de
      # ports à partir de ce commit, il doit donc exister dans le clone.
      VCPKG_TAG: "2026.07.29"
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      # Hors du clone de vcpkg, pour pouvoir le mettre en cache sans dépendre de l'ordre du clone.
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
      # Doit rester égal à la version de la machine de référence (SPECS §10) : clang-format
      # ne produit pas la même sortie d'une version majeure à l'autre, un écart ferait
      # échouer le contrôle de format sur des fichiers pourtant corrects.
      LLVM_VERSION: "23"
      # Explicite plutôt que par défaut : si LeakSanitizer ne pouvait pas tourner sur le
      # runner, le programme s'arrêterait en erreur au lieu de sauter la détection en silence.
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      # zip est indispensable au bootstrap de vcpkg et manque sur l'image.
      #
      # Vulkan : le runner n'a pas de GPU. mesa-vulkan-drivers apporte lavapipe, le Vulkan
      # logiciel de Mesa, qui fournit aussi VK_EXT_headless_surface, la surface du pilote
      # offscreen de SDL. vulkan-validationlayers : la validation est exigée en Debug (règle n°4).
      #
      # Les paquets -dev sont la partie vidéo de la liste officielle de SDL (README-linux,
      # « Build dependencies », Ubuntu). SDL refuse de se configurer s'il manque une extension
      # X11 demandée — contrôles stricts de cmake/sdlchecks.cmake : Xcursor, Xdbe, XInput2,
      # Xfixes, Xsync, Xrandr, Xshape, XTest. La liste réduite que suggère le port vcpkg ne
      # suffit pas. L'audio est absent exprès, SDL s'en passe sans erreur.
      - name: Outils
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ninja-build zip unzip \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libudev-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers

          # Le script est téléchargé puis exécuté, et non passé en pipe à bash : un `wget`
          # qui échoue donnerait sinon une entrée vide à bash, qui rendrait 0 et laisserait
          # l'étape verte sans rien avoir installé.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y \
            clang-format-${{ env.LLVM_VERSION }} clang-tidy-${{ env.LLVM_VERSION }}

          # Des liens dans /usr/local/bin, qui précède /usr/bin dans le PATH.
          # `update-alternatives` ne convient pas ici : /usr/bin/clang++ est un vrai
          # fichier livré par le paquet clang, pas un lien géré par alternatives — la
          # commande ne le remplace donc pas, et la version installée reste ignorée.
          for t in clang clang++ clang-format clang-tidy; do
            sudo ln -sf "/usr/bin/$t-${{ env.LLVM_VERSION }}" "/usr/local/bin/$t"
          done

      # Garde-fou : une chaîne silencieusement différente de celle attendue est exactement
      # ce qui nous a échappé de M0.2 à M0.3. La CI a tourné trois milestones sur clang 18
      # en croyant utiliser clang 22, et personne n'a lu la version qu'elle imprimait.
      - name: Vérifier la chaîne
        run: |
          set -euo pipefail
          clang++ --version | head -1
          clang-format --version
          clang-tidy --version | head -2
          for t in clang++ clang-format clang-tidy; do
            # « version 23. » et non « 23. » : l'horodatage d'un build d'apt.llvm.org peut contenir « 23. ».
            $t --version | grep -q "version ${{ env.LLVM_VERSION }}\." \
              || { echo "::error::$t n'est pas en version ${{ env.LLVM_VERSION }}"; exit 1; }
          done

      - name: Cloner vcpkg
        run: git clone --depth 1 --branch "${{ env.VCPKG_TAG }}" https://github.com/microsoft/vcpkg.git vcpkg

      # Les téléchargements de vcpkg : ses outils (dont son propre CMake) et les sources des ports.
      # Sans ce cache, chaque exécution les reprenait sur GitHub, et une erreur 504 a fait
      # échouer la CI de #72 sans rien à voir avec le code. restore-keys : un manifeste modifié
      # repart des téléchargements précédents au lieu de tout reprendre.
      - name: Cache des téléchargements vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-downloads
          key: vcpkg-downloads-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          restore-keys: vcpkg-downloads-${{ env.VCPKG_TAG }}-

      # Avant le bootstrap : son script refuse de démarrer si VCPKG_DOWNLOADS n'est pas un
      # dossier existant. Et après la restauration, pour la même raison que le cache binaire.
      - name: Créer le dossier des téléchargements
        run: mkdir -p vcpkg-downloads

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # On cache les archives binaires de vcpkg, pas ses sources : 19 Mo mesurés pour
      # nvrhi + flecs + doctest, contre 23 s de compilation à froid (journal, M0.2).
      # ports/ fait partie de la clé : un port overlay modifié change l'ABI du paquet, et un
      # cache figé sous l'ancienne clé le ferait recompiler à chaque exécution.
      # restore-keys : un manifeste modifié repart du cache du manifeste précédent ; vcpkg n'y
      # reprend une archive que si l'ABI de son paquet n'a pas changé, et ne compile que ce qui
      # manque (Rando#9 : 3 min au lieu de 25 à 37 quand Jolt est arrivé). Les archives périmées
      # restent : le cache grossit un peu à chaque changement du manifeste.
      # L'image du runner est dans la clé : une archive compilée sous une autre version d'Ubuntu n'a
      # plus la même ABI. Sous la même clé, vcpkg la recompilerait à chaque exécution, et le cache,
      # déjà présent pour cette clé, ne serait jamais réécrit.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-ubuntu-26.04-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          restore-keys: vcpkg-ubuntu-26.04-${{ env.VCPKG_TAG }}-

      # vcpkg refuse de démarrer si le dossier de cache binaire n'existe pas. Cette étape
      # doit rester APRÈS la restauration : avant, le dossier existerait déjà et le cache
      # ne serait jamais restauré, sans le moindre message d'erreur.
      - name: Créer le dossier de cache
        run: mkdir -p vcpkg-cache

      - name: Configurer et compiler
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      # Garde-fou : un preset dont les drapeaux se seraient perdus compilerait sans
      # instrumentation, et le job resterait vert sans avoir rien vérifié.
      - name: Vérifier l'instrumentation
        if: matrix.preset == 'linux-asan'
        run: |
          for symbol in __asan_init __ubsan_handle; do
            nm build/linux-asan/sandbox/levain_sandbox | grep -q "$symbol" \
              || { echo "::error::$symbol absent : le sandbox n'est pas instrumenté"; exit 1; }
          done

      # --timeout 120 : un test bloqué échoue en 2 min plutôt qu'au délai par défaut de ctest (1 500 s).
      # Le plus lent mesure 5,75 s (smoke.triangle, démarrage de lavapipe), qui varie de 1 à plus de 10 s.
      - name: Tests
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --timeout 120

      # Les assets de test tiers (tools/assets.lock), jamais versionnés : téléchargés et vérifiés
      # par SHA-256, en cache tant que la liste ne change pas.
      # Les fichiers cuits (.cooked) restent hors de ce cache : le camion doit se charger depuis sa
      # source, Sponza depuis sa version cuite, et les deux chemins rester vivants (ADR-0020). Le job
      # Release les garde dans un cache à lui, restauré juste avant la cuisson.
      - name: Cache des assets de test
        uses: actions/cache@v4
        with:
          path: |
            assets-cache
            !assets-cache/.cooked
          key: assets-${{ hashFiles('tools/assets.lock') }}

      - name: Assets de test
        run: ./tools/fetch-assets.sh

      # Le runner n'a pas d'écran : SDL passe par son pilote « offscreen ».
      #
      # --seconds 3 : la boucle s'arrête d'elle-même 3 s après son premier tour, puis le programme sort
      # normalement, et c'est à cette sortie que LeakSanitizer fait son compte. La durée est comptée
      # depuis la boucle, pas depuis le lancement : le démarrage varie de 1 à plus de 10 s selon la charge
      # du runner, et un délai extérieur de 8 s est déjà tombé avant la première frame (PR #59).
      #
      # timeout n'est plus qu'un filet contre un blocage :
      #   --preserve-status : le code de sortie est celui du sandbox, pas celui de timeout.
      #   -k 10 : SIGKILL 10 s plus tard si le programme ignore SIGTERM ; code 137, job rouge.
      #   --foreground : un seul SIGTERM. Sans cette option, timeout en envoie un second au
      #     groupe de processus, et ce second signal fait sauter une assertion du SDL de Debug
      #     (SDL_quit.c:171), qui attend alors une réponse jusqu'au SIGKILL.
      #
      # Le contrôle final exige une boucle d'au moins une seconde : une boucle qui s'arrête tôt sans
      # erreur est une panne silencieuse (règle n°7).
      - name: Lancer le sandbox
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          set -euo pipefail
          timeout --foreground --preserve-status -k 10 60 \
            ./build/${{ matrix.preset }}/sandbox/levain_sandbox --seconds 3 --capture capture.png \
            --model assets-cache/Models/CesiumMilkTruck/glTF/CesiumMilkTruck.gltf \
            | tee sandbox.log
          grep -Eq "boucle arrêtée après ([1-9]|[0-9]{2,})\.[0-9] s" sandbox.log \
            || { echo "::error::la boucle du sandbox a tourné moins d'une seconde"; exit 1; }
          # La capture relit l'image de la swapchain : elle doit exister et ne pas être vide.
          test -s capture.png || { echo "::error::capture.png absente ou vide"; exit 1; }

      # Le hot-reload des textures (M4.4, ADR-0021) : une texture invalide signalée, puis une
      # texture valide rechargée en moins de 2 s. En Release seulement, là où se mesure le
      # critère : sous ASan et lavapipe, le décodage d'une texture 2048² s'en approche. Le script
      # remet la texture du camion en place, avant que la CI ne garde assets-cache en cache.
      - name: Hot-reload des textures
        if: matrix.preset == 'linux-release'
        env:
          SDL_VIDEO_DRIVER: offscreen
          SANDBOX: ./build/${{ matrix.preset }}/sandbox/levain_sandbox
        run: ./tools/texture-hot-reload.sh


      # Fox : un modèle skinné qui passe du repos à la course et revient (M4.5, ADR-0022). En Debug,
      # validation active : c'est la première passe compute du moteur. La ligne « skinning : »
      # prouve que le compute a tourné ; « os le plus rapide » mesure le critère de M4.5, sans saut
      # visible. En local (Release), la course seule atteint 504 unités/s, la locomotion aussi, et
      # une bascule sans fondu 178 110 : au-delà de 1 000, une transition a sauté.
      - name: Lancer le sandbox avec Fox
        if: matrix.preset == 'linux-debug'
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          set -euo pipefail
          timeout --foreground --preserve-status -k 10 60 \
            ./build/${{ matrix.preset }}/sandbox/levain_sandbox --seconds 8 \
            --model assets-cache/Models/Fox/glTF/Fox.gltf --model-scale 0.05 \
            --locomotion Survey,Walk,Run | tee fox.log
          fastest=$(sed -nE 's/.*os le plus rapide : ([0-9]+) unités.*/\1/p' fox.log)
          [ -n "$fastest" ] || { echo "::error::le skinning du renard n'a pas tourné"; exit 1; }
          [ "$fastest" -le 1000 ] \
            || { echo "::error::un os a bougé à $fastest unités/s : saut de pose"; exit 1; }
          # Le temps GPU de la passe d'ombres se mesure (M5.3). Ici sur le renard : sous lavapipe, en
          # Debug, Sponza ne fait que quelques images en 2 s, moins que les trois qu'un timer GPU met à
          # rendre sa mesure. Le chiffre de Sponza vient de la machine de référence (journal).
          grep -Eq "ombres : [0-9.]+ ms GPU en moyenne sur [1-9][0-9]* mesures" fox.log \
            || { echo "::error::le temps GPU de la passe d'ombres n'a pas été mesuré"; exit 1; }
          # Chaque passe chronométrée, et des dessins comptés (#133) : une passe à 0,000 ms n'a pas été
          # mesurée, et une passe absente n'a pas tourné (le renderer ne cite que les étapes mesurées).
          passes=$(grep -E "passes, GPU en moyenne : clusters [0-9.]+ ms, ombres [0-9.]+ ms, opaques [0-9.]+ ms, ciel [0-9.]+ ms, tonemapping" fox.log) \
            || { echo "::error::le temps GPU des passes n'a pas été donné en entier"; exit 1; }
          if grep -q " 0\.000 ms" <<<"$passes"; then
            echo "::error::une passe n'a pas été mesurée : $passes"; exit 1
          fi
          grep -Eq "dessins, par image : caméra [1-9][0-9.]* appels et [1-9][0-9]* triangles" fox.log \
            || { echo "::error::les appels de dessin n'ont pas été comptés"; exit 1; }
          # Le même renard sur le backend WebGPU (Dawn, hors écran, ADR-0023), validation active :
          # le skinning compute passe par le backend, et doit tourner.
          timeout --foreground --preserve-status -k 10 60 \
            ./build/${{ matrix.preset }}/sandbox/levain_sandbox --gpu webgpu --seconds 8 \
            --model assets-cache/Models/Fox/glTF/Fox.gltf --model-scale 0.05 \
            --locomotion Survey,Walk,Run | tee fox-webgpu.log
          grep -q "WebGPU en natif" fox-webgpu.log \
            || { echo "::error::le renard n'a pas tourné sur WebGPU"; exit 1; }
          grep -Eq "os le plus rapide : [1-9]" fox-webgpu.log \
            || { echo "::error::le skinning du renard n'a pas tourné sur WebGPU"; exit 1; }


      # Sponza : 105 dessins par image. En Debug seulement, où la validation de NVRHI est active :
      # c'est elle qui a montré que le buffer des constantes manquait de versions (M4.1).
      # Le terrain (M5.6), premier plugin moteur, le lac et l'herbe (M5.7) : leurs passes s'inscrivent dans
      # le renderer (ADR-0025) et doivent dessiner, sur Vulkan comme sur WebGPU, validation active.
      - name: Lancer le sandbox sur le terrain
        if: matrix.preset == 'linux-debug'
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          set -euo pipefail
          for gpu in vulkan webgpu; do
            timeout --foreground --preserve-status -k 10 120 \
              ./build/${{ matrix.preset }}/sandbox/levain_sandbox --gpu $gpu --seconds 3 \
              --view terrain | tee terrain-$gpu.log
            # La sélection (M6.2) s'inscrit avec la physique, avant le terrain.
            grep -q "étapes du rendu : ombres : modèles, démo, terrain ; opaques : modèles, démo, sélection, terrain" terrain-$gpu.log \
              || { echo "::error::le terrain ne s'est pas inscrit dans le renderer ($gpu)"; exit 1; }
            grep -Eq "terrain, par image : [1-9][0-9.]* parcelles dessinées" terrain-$gpu.log \
              || { echo "::error::aucune parcelle du terrain dessinée ($gpu)"; exit 1; }
            # Le lac (M5.7), le premier dessin de l'étape Transparent : il doit y être inscrit, et
            # chronométré, donc dessiné. Le chronomètre n'existe que sous Vulkan : le backend WebGPU
            # ne mesure pas les temps GPU, et sa ligne de passes reste vide.
            grep -q "transparents : eau" terrain-$gpu.log \
              || { echo "::error::l'eau ne s'est pas inscrite dans le renderer ($gpu)"; exit 1; }
            if [ "$gpu" = vulkan ]; then
              grep -Eq "transparents [0-9.]+ ms" terrain-$gpu.log \
                || { echo "::error::l'étape transparente n'a rien dessiné ($gpu)"; exit 1; }
            fi
            # L'herbe (M5.7), dans l'étape Opaque après le terrain, et des brins demandés.
            grep -q "opaques : modèles, démo, sélection, terrain, herbe" terrain-$gpu.log \
              || { echo "::error::l'herbe ne s'est pas inscrite dans le renderer ($gpu)"; exit 1; }
            grep -Eq "herbe, par image : [0-9.]+ parcelles et [1-9][0-9]* brins" terrain-$gpu.log \
              || { echo "::error::aucun brin d'herbe dessiné ($gpu)"; exit 1; }
            # La physique de la vallée (M6.2) : le terrain, le lac et ses 64 caisses. Qu'elles
            # atteignent l'eau, 2 images par seconde ne le permettent pas ici : terrain_test.cpp le
            # vérifie sans GPU.
            grep -q "physique : 66 corps" terrain-$gpu.log \
              || { echo "::error::la vallée n'a pas ses 66 corps ($gpu)"; exit 1; }
            grep -Eq "lac : [0-9]+ caisses dans l'eau" terrain-$gpu.log \
              || { echo "::error::le lac n'est pas un volume de la physique ($gpu)"; exit 1; }
          done

      # Les 1 000 caisses de M6.1 (ADR-0026), et leur sélection par raycast (M6.2, ADR-0027) : Jolt
      # dans l'application, sous la validation, les sanitizers et les deux backends. La plus haute
      # part de 18,4 m (`HighestCrateStart`) : après 3 s, elle doit être descendue, ce que 8 pas
      # suffisent à montrer. Pas « retombée » : sur lavapipe sous ASan, une image lente plafonne la
      # simulation à 4 pas (ADR-0016), et les caisses tombent alors au ralenti. Le pixel visé, le
      # centre de l'image, touche une caisse dans la grille de départ, pendant la chute et dans le
      # tas (essayé de 0,1 à 8 s) : quelle que soit la vitesse du runner. La capture rend une image
      # après la sélection : le contour passe sous la validation, les sanitizers et WebGPU.
      - name: Lancer le sandbox avec la physique
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          set -euo pipefail
          for gpu in vulkan webgpu; do
            timeout --foreground --preserve-status -k 10 120 \
              ./build/${{ matrix.preset }}/sandbox/levain_sandbox --gpu $gpu --seconds 3 \
              --view physics --pick 960,540 --capture physics-$gpu.png | tee physics-$gpu.log
            line=$(grep -o "physique : [0-9]* corps ; la caisse la plus haute à y = [-0-9.]* m" physics-$gpu.log) \
              || { echo "::error::le sandbox n'a pas rendu compte de la physique ($gpu)"; exit 1; }
            echo "$line" | grep -q "physique : 1001 corps" \
              || { echo "::error::il manque des corps : $line ($gpu)"; exit 1; }
            highest=$(echo "$line" | grep -o "y = [-0-9.]*" | cut -d' ' -f3)
            awk -v y="$highest" 'BEGIN { exit !(y < 18.3) }' \
              || { echo "::error::les caisses n'ont pas bougé : $line ($gpu)"; exit 1; }
            # Le critère de M6.2 : un clic (--pick) sélectionne par raycast une caisse du tas.
            grep -Eq "sélection : ::crate_[0-9]+_[0-9]+_[0-9]+ à [0-9.]+ m" physics-$gpu.log \
              || { echo "::error::la sélection par raycast n'a touché aucune caisse ($gpu)"; exit 1; }
          done

      - name: Lancer le sandbox avec Sponza
        if: matrix.preset == 'linux-debug'
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          set -euo pipefail
          timeout --foreground --preserve-status -k 10 120 \
            ./build/${{ matrix.preset }}/sandbox/levain_sandbox --seconds 2 \
            --model assets-cache/Models/Sponza/glTF/Sponza.gltf | tee sponza.log
          grep -Eq "boucle arrêtée après ([1-9]|[0-9]{2,})\.[0-9] s" sponza.log \
            || { echo "::error::la boucle avec Sponza a tourné moins d'une seconde"; exit 1; }
          # Sponza sur le backend WebGPU, validation active (#185).
          timeout --foreground --preserve-status -k 10 120 \
            ./build/${{ matrix.preset }}/sandbox/levain_sandbox --gpu webgpu --seconds 2 \
            --model assets-cache/Models/Sponza/glTF/Sponza.gltf | tee sponza-webgpu.log
          grep -q "WebGPU en natif" sponza-webgpu.log \
            || { echo "::error::Sponza n'a pas tourné sur WebGPU"; exit 1; }
          grep -Eq "boucle arrêtée après ([1-9]|[0-9]{2,})\.[0-9] s" sponza-webgpu.log \
            || { echo "::error::la boucle de Sponza sur WebGPU a tourné moins d'une seconde"; exit 1; }


      # Le critère de M6.3 (ADR-0028) : le renard monte, dans Sponza, l'escalier posé contre le rebord
      # de 0,9 m de la tranchée. `--steps 200` : exactement 200 pas de simulation, un par image, quelle
      # que soit la vitesse du runner ; le résultat ne dépend donc pas de la machine (mesuré : le même
      # au centimètre sur RADV et sous lavapipe). Parti du fond de la tranchée (y = −0,92), il doit
      # finir au niveau des galeries (−0,02), au sol, sur le palier, toujours dans la tranchée sud
      # (z entre −6,26 et −5,2).
      - name: Lancer le sandbox avec le personnage
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          set -euo pipefail
          timeout --foreground --preserve-status -k 10 300 \
            ./build/${{ matrix.preset }}/sandbox/levain_sandbox --view character --walk 1,0 \
            --steps 200 --capture character.png | tee character.log
          line=$(grep -o "personnage : pieds à ([-0-9., ]*), [^,]*" character.log) \
            || { echo "::error::le sandbox n'a pas rendu compte du personnage"; exit 1; }
          echo "$line" | grep -q ", au sol" \
            || { echo "::error::le personnage n'est pas au sol : $line"; exit 1; }
          feet=$(echo "$line" | grep -o "([-0-9., ]*)" | tr -d '()' | tr ',' ' ')
          read -r x y z <<<"$feet"
          awk -v x="$x" -v y="$y" -v z="$z" \
            'BEGIN { exit !(y > -0.1 && y < 0.05 && x > 0.0 && z > -6.26 && z < -5.2) }' \
            || { echo "::error::le renard n'a pas monté l'escalier : $line"; exit 1; }

      # Le renard dans la vallée (`--view hike`), la vue que montre la page web : Sponza ne peut pas y
      # être publiée. Sur Vulkan et sur WebGPU, le backend du navigateur, avec le terrain, l'herbe et
      # l'eau dessinés. Parti de (204, 280) sur le fond de la vallée, il doit avoir marché vers le lac,
      # au sol, sans dévier : mesuré (206,91 ; −0,05 ; 280,02) sur les deux backends. 120 pas
      # seulement : sous lavapipe, 200 pas prenaient 88 s par backend sur un CPU rapide.
      - name: Lancer le sandbox avec le renard dans la vallée
        if: matrix.preset == 'linux-debug'
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          set -euo pipefail
          for gpu in vulkan webgpu; do
            timeout --foreground --preserve-status -k 10 300 \
              ./build/${{ matrix.preset }}/sandbox/levain_sandbox --gpu $gpu --view hike --walk 1,0 \
              --steps 120 | tee hike-$gpu.log
            grep -q "opaques : modèles, démo, sélection, terrain, herbe ; transparents : eau" hike-$gpu.log \
              || { echo "::error::la vallée ne s'est pas inscrite dans le renderer ($gpu)"; exit 1; }
            line=$(grep -o "personnage : pieds à ([-0-9., ]*), [^,]*" hike-$gpu.log) \
              || { echo "::error::le sandbox n'a pas rendu compte du renard ($gpu)"; exit 1; }
            echo "$line" | grep -q ", au sol" \
              || { echo "::error::le renard n'est pas au sol : $line ($gpu)"; exit 1; }
            feet=$(echo "$line" | grep -o "([-0-9., ]*)" | tr -d '()' | tr ',' ' ')
            read -r x y z <<<"$feet"
            awk -v x="$x" -v z="$z" 'BEGIN { exit !(x > 206.0 && x < 208.0 && z > 279.0 && z < 281.0) }' \
              || { echo "::error::le renard n'a pas marché vers le lac : $line ($gpu)"; exit 1; }
          done

      # L'interface (M7.1, ADR-0032) : les panneaux de debug ouverts dès le départ (`--ui on`), sur
      # les deux backends, validation active (Debug). L'UI doit avoir dessiné quelque chose ; sous
      # Vulkan, son minuteur GPU doit avoir mesuré ; sous WebGPU, notre backend ne relit pas les
      # minuteurs, et le bilan doit le dire (« non mesuré ») au lieu d'un 0 qui passerait pour une
      # mesure. Le temps lui-même se juge sur la machine de référence, pas sous lavapipe. La capture
      # rejoue l'image d'UI que `captureFrame` construit, sous validation elle aussi.
      - name: L'interface
        if: matrix.preset == 'linux-debug'
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          set -euo pipefail
          for gpu in vulkan webgpu; do
            timeout --foreground --preserve-status -k 10 300 \
              ./build/${{ matrix.preset }}/sandbox/levain_sandbox --gpu $gpu --view hike --ui on \
              --steps 60 --capture ui-$gpu.png | tee ui-$gpu.log
            test -s ui-$gpu.png || { echo "::error::pas de capture avec l'UI ($gpu)"; exit 1; }
            line=$(grep -o "ui : CPU .* commandes dessinées" ui-$gpu.log) \
              || { echo "::error::le sandbox n'a pas rendu compte de l'UI ($gpu)"; exit 1; }
            draws=$(echo "$line" | grep -o "[0-9]* commandes dessinées" | grep -o "^[0-9]*")
            [ "$draws" -gt 0 ] || { echo "::error::l'UI n'a rien dessiné : $line ($gpu)"; exit 1; }
            if [ "$gpu" = vulkan ]; then
              { echo "$line" | grep -q "GPU [0-9.]* ms en moyenne" \
                && ! echo "$line" | grep -q "GPU 0\.000 ms"; } \
                || { echo "::error::le minuteur GPU de l'UI n'a rien mesuré : $line"; exit 1; }
            else
              echo "$line" | grep -q "GPU non mesuré" \
                || { echo "::error::sous WebGPU, le temps GPU de l'UI devrait être non mesuré : $line"; exit 1; }
            fi
          done

      # Le cuiseur, sans GPU (ADR-0020), en Release seulement : l'encodage UASTC y est 5 fois plus
      # rapide qu'en Debug (1,0 s contre 5,1 s pour la texture du camion), et cuire Sponza en Debug
      # prendrait une dizaine de minutes. Debug et ASan chargent donc les sources, Release le cuit :
      # les deux chemins restent vivants.
      # Les fichiers cuits, en cache pour ce seul job (2 min 30 à 4 min de cuisson à chaque PR),
      # restaurés juste avant la cuisson : les étapes d'avant chargent les sources.
      #   - Avec les `.meta` : un fichier cuit porte le GUID de son asset, que le `.meta` fixe ; sans
      #     lui, chaque run tire de nouveaux GUID et ne retrouve rien. La restauration écrase ceux
      #     que les étapes précédentes ont tirés.
      #   - Sans `restore-keys` : le cuiseur ne recuit que si sa version ou la source change, et
      #     `CookerVersion` ne suit pas chaque changement de sa sortie. Toute clé nouvelle recuit tout.
      #     La clé suit les assets, le cuiseur, le module assets et les dépendances (libktx, basisu).
      - name: Cache des assets cuits
        id: cooked
        if: matrix.preset == 'linux-release'
        uses: actions/cache@v4
        with:
          path: |
            assets-cache/.cooked
            assets-cache/**/*.meta
          key: cooked-${{ hashFiles('tools/assets.lock', 'tools/cook/**', 'engine/assets/**', 'vcpkg.json', 'ports/**') }}

      # Un cache trouvé ne doit rien laisser à cuire : un fichier recuit trahirait un cache qui ne
      # sert pas, et la CI resterait verte en payant la cuisson (règle n°7).
      - name: Cuire les assets de test
        if: matrix.preset == 'linux-release'
        run: |
          set -euo pipefail
          ./build/${{ matrix.preset }}/tools/cook/levain_cook assets-cache 2>&1 | tee cook.log
          if [ "${{ steps.cooked.outputs.cache-hit }}" = true ] && grep -Eq "cuit en|texture cuite|collision cuite" cook.log; then
            echo "::error::cache des assets cuits restauré, mais le cuiseur a recuit des fichiers"
            exit 1
          fi

      - name: Lancer le sandbox avec Sponza cuite
        if: matrix.preset == 'linux-release'
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          set -euo pipefail
          timeout --foreground --preserve-status -k 10 120 \
            ./build/${{ matrix.preset }}/sandbox/levain_sandbox --seconds 2 \
            --model assets-cache/Models/Sponza/glTF/Sponza.gltf | tee sponza-cooked.log
          if grep -q "depuis la source" sponza-cooked.log; then
            echo "::error::un asset de Sponza chargé depuis sa source : la cuisson n'a pas servi"
            exit 1
          fi
          # La collision du décor (ADR-0028), relue de son .lvcol : la vue du personnage, deux pas.
          timeout --foreground --preserve-status -k 10 120 \
            ./build/${{ matrix.preset }}/sandbox/levain_sandbox --view character --steps 2 \
            | tee character-cooked.log
          grep -q "collision de sponza : [0-9]* triangles, chargés" character-cooked.log \
            || { echo "::error::la vue du personnage n'a pas chargé la collision de Sponza"; exit 1; }
          if grep -Eq "simplifiée au chargement|depuis la source" character-cooked.log; then
            echo "::error::la collision de Sponza simplifiée au chargement : le .lvcol n'a pas servi"
            exit 1
          fi

      # Le build profilé (#298) : les macros de profilage n'y sont pas vides (`LEVAIN_PROFILE_SCOPE_TEXT`,
      # `LEVAIN_PROFILE_PLOT`, le bloc de `plotStageTimes`), et aucun autre build ne les compile. Sans
      # lui, une erreur n'y paraîtrait qu'au premier profilage, en local. Le sandbox et les tests
      # seulement, dans un dossier à part, avec les paquets vcpkg déjà installés. Les tests ne sont pas
      # lancés, mais le binaire des tests démarre une fois : doctest y liste ses cas après le lien, et son
      # client Tracy sort sans attendre de profileur. Les symboles de Tracy prouvent que
      # l'instrumentation y est : sans eux, l'étape compilerait un build ordinaire et resterait verte
      # (règle n°7).
      - name: Compiler le build profilé
        if: matrix.preset == 'linux-release'
        run: |
          set -euo pipefail
          cmake --preset linux-release -B build/prof -DLEVAIN_PROFILING=ON \
            -DVCPKG_INSTALLED_DIR="$PWD/build/linux-release/vcpkg_installed"
          cmake --build build/prof --target levain_sandbox levain_tests
          # Les symboles lus d'abord, puis cherchés : `nm | grep -q` échouerait sous pipefail, grep
          # fermant le tube avant la fin de nm (build/GOTCHA.md).
          for binary in sandbox/levain_sandbox tests/levain_tests; do
            symbols=$(nm -C build/prof/$binary)
            grep -q "tracy::" <<< "$symbols" \
              || { echo "::error::$binary sans Tracy : le build profilé ne profile rien"; exit 1; }
          done

      # Format et analyse statique une seule fois : ce sont des propriétés des sources, pas
      # de la configuration de build.
      - name: Format
        if: matrix.preset == 'linux-debug'
        run: |
          find engine plugins sandbox tests tools -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror

      - name: Analyse statique
        if: matrix.preset == 'linux-debug'
        run: |
          # Les fichiers que ce build compile, et eux seuls : ceux du navigateur (Emscripten) n'y sont
          # pas, et clang-tidy les analyserait sans leurs options, donc à tort.
          jq -r '.[].file' build/${{ matrix.preset }}/compile_commands.json \
            | grep -E "^$PWD/(engine|plugins|sandbox|tests|tools)/" | sort -u \
            | xargs clang-tidy -p build/${{ matrix.preset }} --warnings-as-errors='*'

  # Le code CPU compilé en WebAssembly, ses tests lancés par Node (ADR-0023, #182). Un job à part :
  # ni LLVM, ni Vulkan, ni X11, mais Emscripten, figé sur la version de la machine de référence.
  # Pas encore un check requis par la protection de `main` : à décider avec Donnovan.
  web:
    name: web
    # Même image que les jobs natifs, et pour la même raison.
    runs-on: ubuntu-26.04

    env:
      VCPKG_TAG: "2026.07.29"
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
      EMSDK_VERSION: "6.0.10"

    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip unzip

      - name: Cache d'Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      # Installé seulement s'il n'est pas déjà dans le cache. emsdk apporte aussi Node, qui lance
      # les tests (CMAKE_CROSSCOMPILING_EMULATOR, posé par la toolchain d'Emscripten).
      - name: Emscripten
        run: |
          set -euo pipefail
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            rm -rf emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
            ./emsdk/emsdk install ${{ env.EMSDK_VERSION }}
          fi
          ./emsdk/emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Cloner vcpkg
        run: git clone --depth 1 --branch "${{ env.VCPKG_TAG }}" https://github.com/microsoft/vcpkg.git vcpkg

      - name: Cache des téléchargements vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-downloads
          key: vcpkg-downloads-web-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}
          restore-keys: vcpkg-downloads-web-${{ env.VCPKG_TAG }}-

      - name: Créer le dossier des téléchargements
        run: mkdir -p vcpkg-downloads

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # Une clé à part des jobs natifs : les paquets wasm32-emscripten ne leur servent pas, et deux
      # jobs qui écrivent la même clé se la disputent. L'image du runner y est aussi, comme pour eux.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-web-ubuntu-26.04-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}
          # Comme pour les jobs natifs : un manifeste modifié ne recompile que ce qui manque.
          restore-keys: vcpkg-web-ubuntu-26.04-${{ env.VCPKG_TAG }}-

      - name: Créer le dossier de cache
        run: mkdir -p vcpkg-cache

      # Le sandbox web précharge le renard et le camion : même cache que les jobs Linux.
      - name: Cache des assets de test
        uses: actions/cache@v4
        with:
          path: |
            assets-cache
            !assets-cache/.cooked
          key: assets-${{ hashFiles('tools/assets.lock') }}

      - name: Assets de test
        run: ./tools/fetch-assets.sh

      - name: Configurer, compiler et tester
        run: |
          set -euo pipefail
          source emsdk/emsdk_env.sh
          emcc --version | head -1
          cmake --preset web
          cmake --build --preset web
          ctest --test-dir build/web --output-on-failure -j4
          # Au moins les tests du code CPU : une liste vide passerait sans rien vérifier (règle n°7).
          count=$(ctest --test-dir build/web -N | sed -nE 's/^Total Tests: ([0-9]+)/\1/p')
          [ "$count" -ge 80 ] || { echo "::error::seulement $count tests web"; exit 1; }
          # La page du sandbox (#186), que publiera GitHub Pages.
          test -s build/web/sandbox/levain_sandbox.wasm \
            || { echo "::error::le sandbox web n'a pas été construit"; exit 1; }

      # Le sandbox publié sur GitHub Pages (ADR-0023), depuis main seulement : la page et ses trois
      # fichiers, rien d'autre du build.
      - name: Préparer la page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages
          cp build/web/sandbox/{levain_sandbox.{html,js,wasm,data},stats.js} pages/
          cp pages/levain_sandbox.html pages/index.html
          # Chaque script local que la page charge doit être publié avec elle : sans stats.js (#294),
          # le calque manquerait, et le test de fumée, qui sert build/web, ne le verrait pas. Emscripten
          # minifie la page : `src=stats.js`, sans guillemets. Au moins deux scripts, sinon le motif
          # ne reconnaît plus rien et le contrôle passerait sans rien vérifier (règle n°7).
          scripts=$(grep -oE 'src="?[^" >]+' pages/index.html | sed -E 's/^src="?//' | grep -v ':' || true)
          [ "$(echo "$scripts" | grep -c .)" -ge 2 ] \
            || { echo "::error::scripts de la page non reconnus : $scripts"; exit 1; }
          for script in $scripts; do
            [ -f "pages/$script" ] || { echo "::error::$script, chargé par la page, n'est pas publié"; exit 1; }
          done

      - name: Envoyer la page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  # Publie ce que le job web a préparé. Les droits d'écriture sur Pages ne sont donnés qu'à ce job.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
