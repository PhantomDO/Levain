<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8c5224; font: 13px system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #status { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; color: #fff; pointer-events: none; }
  #credits { position: fixed; z-index: 1; left: 8px; bottom: 6px; color: #fffc; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay">
<div id="status">Chargement…</div>
<!-- Les licences des modèles publiés (tools/assets.lock). -->
<div id="credits">Renard : PixelMannen (CC0), tomkranis, @AsoboStudio, @scurest (CC-BY 4.0) ·
  Camion : Cesium (CC-BY 4.0) · <a href="https://github.com/PhantomDO/Levain" style="color:inherit">Levain</a></div>
</div>
<script>
const status = document.getElementById("status");
// En fill-document, SDL range tout ce qui n'est pas le canvas dans un élément caché : le calque en
// ressort, pour que les crédits restent visibles.
const overlay = document.getElementById("overlay");
new MutationObserver(() => {
  if (overlay.parentElement !== document.body) document.body.append(overlay);
}).observe(document.body, { childList: true, subtree: true });
// Les arguments du sandbox : ceux de ?args=…, sinon le renard qui court.
const args = new URLSearchParams(location.search).get("args")
  ?? "--model /assets-cache/Models/Fox/glTF/Fox.gltf --model-scale 0.05 --locomotion Survey,Walk,Run";
var Module = {
  canvas: document.getElementById("canvas"),
  arguments: args.split(" ").filter(Boolean),
  print: (text) => console.log(text),
  printErr: (text) => console.error(text),
  setStatus: (text) => { status.textContent = text; },
  onRuntimeInitialized: () => { status.textContent = ""; },
};
if (!navigator.gpu) {
  status.textContent = "Ce navigateur n'a pas WebGPU (Firefox : dom.webgpu.enabled ; Chrome et Edge : récents).";
}
</script>
{{{ SCRIPT }}}
</body>
</html>
